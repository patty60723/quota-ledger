        <label>金額（NT$）<input class="inp num" id="f-amt" inputmode="numeric" value="${f.amount ?? ""}" placeholder="空白＝每次輸入"></label>
        <label>收支<select id="f-type"><option value="expense" ${f.type==="expense"?"selected":""}>支出</option><option value="income" ${f.type==="income"?"selected":""}>收入</option></select></label>
        <label>類別<select id="f-cat">${catOpts(f.type)}</select></label>
        <label>摘要<input class="inp" id="f-title" value="${esc(f.title)}" placeholder="空白＝用名稱"></label>
        <label>備註<input class="inp" id="f-note" value="${esc(f.note)}" placeholder="選填"></label>
      </div>
      ${isNew ? "" : `<p class="small muted" style="margin:0">用了 ${f.uses || 0} 次</p>`}
      <div class="rowbtns">${isNew ? "" : `<button class="btn danger" data-del>${confirmDel ? "確定刪除" : "刪除"}</button>`}<button class="btn primary" data-save>儲存</button></div>`;
    $("[data-x]", sheet).addEventListener("click", closeSheet);
    $("#f-type", sheet).addEventListener("change", e => { f.type = e.target.value; $("#f-cat", sheet).innerHTML = catOpts(f.type); });
    const del = $("[data-del]", sheet);
    del && del.addEventListener("click", () => { if(!confirmDel){ confirmDel = true; del.textContent = "確定刪除"; return; } put.favDel(f.id); closeSheet(); render(); toast("已刪除常用"); });
    $("[data-save]", sheet).addEventListener("click", () => {
      const name = $("#f-name", sheet).value.trim(); const categoryId = $("#f-cat", sheet).value;
      if(!name || !categoryId){ toast("請填名稱並選類別"); return; }
      put.fav({ ...f, name, type: $("#f-type", sheet).value, categoryId, amount: intOf($("#f-amt", sheet).value), title: $("#f-title", sheet).value.trim(), note: $("#f-note", sheet).value.trim() });
      closeSheet(); render(); toast("已儲存常用");
    });
  };
  openSheet("", draw);
}

/* ---------- wishlist (慾望清單) ---------- */
const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
function wishScore(w){
  const created = w.addedOn || todayStr(); const days = Math.max(0, dayDiff(created, todayStr()));
  const parts = { need: w.need==="need" ? 40 : 10, wait: Math.round(Math.min(days, 30) / 30 * 20), budget: 0, deadline: 0 };
  const c = state.categories[w.categoryId];
  if(w.price){
    const avail = c && c.monthlyLimit ? budgetOf(c, curPeriod()).avail : Infinity;
    parts.budget = w.price <= avail ? 25 : w.price <= avail + poolBalance() ? 10 : 0;
  }
  if(w.deadline){ const d = dayDiff(todayStr(), w.deadline); parts.deadline = d <= 7 ? 15 : d <= 30 ? 8 : 0; }

function wishBudgetLine(w){

/* ---------- import: Google Sheet xlsx ---------- */
function cellDate(v, fallbackYm, issues, where){
  if(v instanceof Date && !isNaN(v)) return { date: ymd(new Date(v.getFullYear(), v.getMonth(), v.getDate())) };
  if(typeof v === "number" && window.XLSX){ const d = XLSX.SSF.parse_date_code(v); if(d) return { date: `${d.y}-${pad(d.m)}-${pad(d.d)}` }; }
  const s = String(v ?? "").trim(); const m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(m){ const y=+m[1], mo=+m[2], d=+m[3]; if(mo>=1 && mo<=12 && d>=1 && d<=dim(y,mo)) return { date: `${y}-${pad(mo)}-${pad(d)}` }; }
  issues.push(`${where}：日期「${s || "空白"}」看不懂，先記在 ${fallbackYm}-01，原始文字放進備註`);
  return { date: `${fallbackYm}-01`, bad: s };
}
function parseWorkbook(wb, fileName){
  const issues = []; const byName = {}; Object.values(state.categories).forEach(c => byName[c.name] = c);
  const INCOME = new Set(["薪資","退貨或銷帳"]);
  const catsOut = {}; const ensureCat = (name, type, where) => {
    name = String(name||"").trim(); if(!name) return null;
    if(catsOut[name]) return catsOut[name].id;
    const ex = byName[name];
    const c = ex ? {...ex} : { id: uid(), name, type, monthlyLimit: null, perTxLimit: null, dailyLimit: null, yearlyLimit: null, warn: false, archived: false, sort: 100 + Object.keys(catsOut).length };
    if(!ex && where) issues.push(`${where}：類別「${name}」原本不存在，已自動新增`);
    catsOut[name] = c; return c.id;
  };
  const sheetRows = n => {
    const ws = wb.Sheets[n]; if(!ws) return null;
    const r0 = ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]).s.r : 0;
    return { rows: XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null}), r0 };
  };
  const num = v => { if(typeof v === "number") return v; const s = String(v ?? "").replace(/[,\s]/g,""); return /^\d+(\.\d+)?$/.test(s) ? +s : null; };

  const catSheet = sheetRows("類別與預算控制");

    Object.assign(catsOut[name], { perTxLimit: lim(r[1]), dailyLimit: lim(r[2]), monthlyLimit: lim(r[3]), yearlyLimit: lim(r[4]), warn: String(r[5]||"").trim() === "開啟", type: INCOME.has(name) ? "income" : "expense", archived: false }); }); }
  else issues.push("找不到「類別與預算控制」工作表，類別沿用目前設定");

  const recs = []; const now = new Date(); const curYm = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const recSheet = sheetRows("固定收支");
  if(recSheet){ recSheet.rows.slice(1).forEach((r,i) => { if(!r[0]) return; const where = `固定收支第 ${recSheet.r0+i+2} 列`; const amt = num(r[1]); if(!amt){ issues.push(`${where}：金額不是數字，略過`); return; }
    const type = String(r[2]||"").trim()==="收入" ? "income" : "expense";
    const existing = Object.values(state.recurring).find(x => x.title===String(r[0]).trim() && x.type===type);
    recs.push({ id: existing?.id || uid(), title: String(r[0]).trim(), amount: amt, type, categoryId: ensureCat(r[3], type, where), day: Math.min(31, Math.max(1, num(r[4]) || 1)), active: String(r[5]||"").trim() !== "關閉", startMonth: existing?.startMonth || curYm }); }); }

  const insts = []; const instSheet = sheetRows("分期項目");
  if(instSheet){ instSheet.rows.slice(1).forEach((r,i) => {
    if(!r[0]) return; const row = instSheet.r0 + i + 2; const where = `分期項目第 ${row} 列`;
    const total = num(r[1]), nn = num(r[3]);
    if(!total || !nn || nn < 2){ issues.push(`${where}：總金額或期數不是數字，略過`); return; }
    if(!String(r[2]||"").trim()){ issues.push(`${where}：「${String(r[0]).trim()}」沒有填類型，略過`); return; }
    if(String(r[7]||"").trim()==="關閉"){ issues.push(`${where}：狀態是關閉，略過`); return; }
    const d = r[8] instanceof Date ? ymd(new Date(r[8].getFullYear(), r[8].getMonth(), r[8].getDate())) : null;
    if(!d){ issues.push(`${where}：起始年月看不懂，略過`); return; }
    const per = num(r[5]) || Math.floor(total / nn); const first = num(r[4]) || total - per*(nn-1);
    insts.push({ id: `imp-inst-${row}`, title: String(r[0]).trim(), categoryId: ensureCat(r[2], "expense", where), total: Math.round(total), n: nn, per: Math.round(per), first: Math.round(first), date: d, note: "",
      startPeriod: pkey(periodOf(d)), status: "active", events: [{ type: "create", at: Date.now() }], createdAt: Date.now() });
  }); }

  const wishes = []; const wishSheet = sheetRows("慾望清單");
  if(wishSheet){ wishSheet.rows.slice(1).forEach((r,i) => {
    const name = String(r[0]||"").trim(); if(!name) return; const row = wishSheet.r0 + i + 2;
    const bought = r[6] !== null && r[6] !== false && !/^(否|false|0|)$/i.test(String(r[6]).trim());
    const dl = r[7] instanceof Date ? ymd(new Date(r[7].getFullYear(), r[7].getMonth(), r[7].getDate())) : "";
    const existing = state.wishes[`imp-wish-${row}`];

      need: String(r[3]||"").trim()==="需要" ? "need" : "want", price: lim(r[4]), deadline: dl, note: "", addedOn: existing?.addedOn || todayStr(), createdAt: existing?.createdAt || Date.now() };
    if(bought) w.purchasedOn = existing?.purchasedOn || todayStr();
    if(!w.price) issues.push(`慾望清單第 ${row} 列：「${name}」沒有價格，先匯入，之後再補`);
    wishes.push(w);
  }); }
  const txs = []; const sheets = [];
  wb.SheetNames.filter(n => /^\d{6}$/.test(n)).forEach(n => {
    const ym = `${n.slice(0,4)}-${n.slice(4)}`; sheets.push(n); const { rows: R, r0 } = sheetRows(n); let seenHeader = false;

        txs.push({ id: `imp-${n}-${r0+ri+1}-${o?"i":"e"}`, date: d.date, type, categoryId: ensureCat(r[o+1] || (type==="income"?"其他收入":"其他支出"), type, where), amount: Math.round(amt), title: String(r[o+2] ?? "").trim(), note, recurringId: null, createdAt: Date.now()+ri });
      });
    });
  });
  if(!sheets.length) issues.push("沒有找到像「202504」這樣以年月命名的工作表");
  return { fileName, cats: Object.values(catsOut), recs, insts, wishes, txs, sheets, issues };
}
function applyImport(pv){
  persistSeedIfNeeded();
  pv.cats.forEach(c => put.cat(c));
  pv.recs.forEach(r => put.rec(r));
  pv.insts.forEach(i => put.inst(i));
  (pv.wishes || []).forEach(w => put.wish(w));
  const ids = new Set(pv.txs.map(t=>t.id)); const touched = new Set();
  Object.keys(state.months).forEach(ym => { const before = state.months[ym].length; state.months[ym] = state.months[ym].filter(t => !ids.has(t.id)); if(state.months[ym].length !== before) touched.add(ym); });
  pv.txs.forEach(t => { const ym = t.date.slice(0,7); (state.months[ym] ||= []).push(t); touched.add(ym); });
  touched.forEach(ym => put.month(ym));
  toast(`已匯入 ${pv.txs.length} 筆交易`);
}

  };

}
// wiping everything: the button only unlocks after typing the phrase, and the sheet points to a backup first

    <div class="rowbtns"><button class="btn danger" data-go disabled>清除所有資料</button></div>`, sheet => {

async function wipeAll(){
  if(db){
    COLS.forEach(n => Object.keys(state[n] || {}).forEach(id => write(n+"/"+id, null)));
    Object.keys(state.months).forEach(ym => write("months/"+ym, null));
    write("meta/settings", null);
    await Promise.all([...chains.values()].map(p => p.catch(() => {})));
  }
  // write() also saves locally, so the local copy is removed last; the reload then starts like a first visit
  try{ [LS_KEY, "ledger.tab", "ledger.setpage", "ledger.rankview"].forEach(k => localStorage.removeItem(k)); }catch(e){}
  location.reload();
}
function backupJson(){ return JSON.stringify({ app: "額度帳本", version: 2, exportedAt: new Date().toISOString(), data: state }, null, 1); }
async function doExport(){
  const name = `額度帳本備份-${todayStr()}.json`; const data = backupJson();
  let dl = null; try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(dl){ try{ const r = await dl.save({ filename: name, data }); if(r && r.status==="saved"){ markBackup(); toast("已匯出備份"); } return; }catch(e){ if(e && e.code==="cancelled") return; } }
  if(!window.claude){
    try{
      const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); markBackup(); toast("已匯出備份"); return;
    }catch(e){}
  }
  if(!$("#exportBox")) goSet("data");
  const box = $("#exportBox"); if(!box) return; box.scrollIntoView();
  box.innerHTML = `<div class="note"><p style="margin:0 0 6px">這個畫面不能直接下載。請複製下面的內容，存成 .json 檔。</p><textarea class="backup" id="bk" readonly>${esc(data)}</textarea>
    <button class="btn small" data-act="copy" style="margin-top:6px">複製</button></div>`;
}
// some in-app browsers can't open a file picker, so the backup's text can be pasted instead
function openPasteRestore(){
  openSheet(`<div class="hd"><h2>貼上備份內容</h2><button class="btn ghost" data-x>關閉</button></div>
    <p class="small muted" style="margin:0">用檔案 App 打開「額度帳本備份-日期.json」，全選、複製，再貼到下面。還原會取代這裡目前所有的資料。</p>
    <textarea class="backup" id="pr-text" placeholder='{"app":"額度帳本", ...}' aria-label="備份內容"></textarea>
    <div class="rowbtns"><button class="btn primary" data-go>還原</button></div>`, sheet => {
    $("[data-x]", sheet).addEventListener("click", closeSheet);
    $("[data-go]", sheet).addEventListener("click", () => {
      let obj; try{ obj = JSON.parse($("#pr-text", sheet).value.trim()); }catch(err){ toast("內容不完整，請確認整份都有複製到"); return; }
      if(!obj || !obj.data || !obj.data.categories){ toast("這不是額度帳本的備份"); return; }
      closeSheet(); restoreBackup(obj);
    });
  });
}
function restoreBackup(obj){
  const d = obj && obj.data; if(!d || !d.categories){ toast("這不是額度帳本的備份檔"); return; }
  const old = clone(state);
  state = normalize(d);
  usingDefaults = false;
  if(db){
    COLS.forEach(n => Object.keys(old[n] || {}).forEach(id => { if(!state[n][id]) write(n+"/"+id, null); }));
    Object.keys(old.months).forEach(ym => { if(!state.months[ym]) write("months/"+ym, null); });
  }
  pushAll(); ensureJars(); saveLocal(); render(); toast("已從備份還原");
}

          : `<div class="fields"><label class="full">月預算從哪天開始<select id="ob-cycle">${Array.from({length:31}, (_,i) => `<option value="${i+1}" ${ob.cycle === i+1 ? "selected" : ""}>每月 ${i+1} 日</option>`).join("")}</select></label></div>
          <p class="small muted obnote">預算照這一天重新開始；發薪日只用來提醒你確認薪資入帳，不會影響每天能花多少。</p>`}
        <p class="small muted obnote">收入不固定？填一個保守的月平均（例如最近幾個月裡最少的那個月），或先留空，App 會改用上一期實際記到的收入估算。</p>${foot("下一步")}`);
      $("#ob-inc", el).addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); ob.income = intOf(e.target.value); });
      $("#ob-pay", el).addEventListener("change", e => { ob.payday = +e.target.value; });
      $("#ob-same", el).addEventListener("change", e => { ob.sameCycle = e.target.checked; draw(); });
      const cy = $("#ob-cycle", el); cy && cy.addEventListener("change", e => { ob.cycle = +e.target.value; });
    } else if(ob.step === 2){
      el = obShell(`${top(2)}<h2 class="obh">挑出你會用到的類別</h2><p class="obp">常用的已經先勾好，點一下可以取消。沒勾的不會刪掉，之後在設定裡能再打開。</p>
        <div class="chips obchips" role="group" aria-label="支出類別">${catList().map(c => `<button class="chip" data-obcat="${esc(c.id)}" aria-pressed="${ob.picked.has(c.id)}"><span class="dot sm ${catTint({ sort: exp.findIndex(x => x.id === c.id) >= 0 ? exp.findIndex(x => x.id === c.id) : 100 + ob.extra.indexOf(c) })}">${catMark({ name: c.name })}</span>${esc(c.name)}</button>`).join("")}</div>
        <div class="obadd"><input class="inp" id="ob-new" placeholder="新增自己的類別，例如：咖啡" maxlength="12"><button class="btn" data-ob="addcat">新增</button></div>
        ${foot(`下一步（已選 ${ob.picked.size} 類）`)}`);
      el.querySelectorAll("[data-obcat]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.obcat; ob.picked.has(id) ? ob.picked.delete(id) : ob.picked.add(id); draw(); }));
      $("#ob-new", el).addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); el.querySelector('[data-ob="addcat"]').click(); } });
    } else if(ob.step === 3){
      const list = chosen(); const lim = limitsNow();
      el = obShell(`${top(3)}<h2 class="obh">設定每月預算</h2><p class="obp">幫每一類設個上限，首頁就會算出每天可以花多少。不確定可以先略過。</p>
        <div class="fields"><label class="full">每月想存下多少（NT$，選填）<input class="inp num" id="ob-save" inputmode="numeric" placeholder="0" value="${ob.save ?? ""}"></label></div>
        <p class="small muted" style="margin:0">會先放進一個叫「儲蓄」的存錢罐；之後可以到設定 → 預算與儲蓄，改名或依用途分成好幾個。</p>
        <div class="seg" role="radiogroup" aria-label="預算怎麼填"><button role="radio" data-obmode="each" aria-pressed="${ob.mode === "each"}" aria-checked="${ob.mode === "each"}">每類自己填</button><button role="radio" data-obmode="total" aria-pressed="${ob.mode === "total"}" aria-checked="${ob.mode === "total"}">先填總額</button></div>
        ${ob.mode === "total" ? `<div class="fields"><label class="full">每月預算總額（NT$）<input class="inp num" id="ob-total" inputmode="numeric" placeholder="${room() ?? "例如 25000"}" value="${ob.total ?? ""}"></label></div>
          <p class="small muted obnote">會照常見比例分給 ${list.length} 個類別，之後在設定裡可以再調。</p>` : ""}
        <div class="card oblims">${list.length ? list.map(c => `<label class="oblim"><span class="nm">${esc(c.name)}</span>${ob.mode === "total" ? `<span class="num v">${lim[c.id] ? moneyShort(lim[c.id]) : "—"}</span>` : `<input class="inp num" data-oblim="${esc(c.id)}" inputmode="numeric" placeholder="不設定" value="${ob.limits[c.id] ?? ""}" aria-label="${esc(c.name)} 每月上限">`}</label>`).join("") : `<div class="empty">沒有選類別，可以回上一步挑。</div>`}</div>
        <p class="small obsum" id="ob-sum">${sumLine()}</p>${foot("下一步")}`);
      const upd = () => { $("#ob-sum", el).innerHTML = sumLine(); };
      $("#ob-save", el).addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); ob.save = intOf(e.target.value); upd(); });
      el.querySelectorAll("[data-obmode]").forEach(b => b.addEventListener("click", () => { ob.mode = b.dataset.obmode; if(ob.mode === "total" && !ob.total && room()) ob.total = room(); draw(); }));
      const t = $("#ob-total", el); t && t.addEventListener("change", e => { ob.total = intOf(e.target.value); draw(); });
      t && t.addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, ""); });
      el.querySelectorAll("[data-oblim]").forEach(i => i.addEventListener("input", () => { i.value = i.value.replace(/\D/g, ""); ob.limits[i.dataset.oblim] = intOf(i.value); upd(); }));
    } else {
      finish(); return;
    }
    el.querySelectorAll("[data-ob]").forEach(b => b.addEventListener("click", () => act(b.dataset.ob)));
  };
  const act = a => {
    if(a === "next"){ if(ob.step === 3 && ob.mode === "total"){ const t = $("#ob-total"); if(t) ob.total = intOf(t.value); } ob.step++; draw(); }
    else if(a === "back"){ ob.step = Math.max(0, ob.step - 1); draw(); }
    else if(a === "skipall"){ ob.step = 4; skipped = true; draw(); }
    else if(a === "restore"){ obClose(); if(!dry){ state.settings.onboarded = true; put.settings(); } goSet("data"); toast("選「從備份還原」或「貼上備份內容還原」"); }
    else if(a === "addcat"){ const i = $("#ob-new"); const name = (i.value || "").trim(); if(!name) return;
      const hit = catList().find(c => c.name === name); if(hit){ ob.picked.add(hit.id); draw(); return; }
      const c = { id: uid(), name }; ob.extra.push(c); ob.picked.add(c.id); draw(); }
  };
  let skipped = false;
  const finish = () => {
    // dry run (preview only): nothing is saved; the home page shows the first-period note as a demo until reload
    if(dry){ openGuide(true, () => { demoStart = todayStr() > periodRange(curPeriod())[0] ? todayStr() : null; tab = "home"; render(); window.scrollTo(0,0); toast("預覽模式：設定沒有儲存，首頁的第一期提示只是示範"); }); return; }
    if(!skipped) apply();
    state.settings.onboarded = true; state.settings.startedOn = todayStr(); put.settings();
    tab = "home"; try{ localStorage.setItem("ledger.tab", tab); }catch(e){}
    render(); openGuide(true);
  };
  const apply = () => {
    const lim = limitsNow();
    exp.forEach(d => { const c = { ...state.categories[d.id] };
      if(ob.picked.has(d.id)){ c.archived = false; if(lim[d.id]){ c.monthlyLimit = lim[d.id]; c.warn = true; } }
      else c.archived = true;
      put.cat(c); });
    ob.extra.filter(x => ob.picked.has(x.id)).forEach((x, i) => put.cat({ id: x.id, name: x.name, type: "expense", monthlyLimit: lim[x.id] || null, perTxLimit: null, dailyLimit: null, yearlyLimit: null, warn: !!lim[x.id], archived: false, sort: 100 + i }));
    state.settings.cycleStartDay = ob.sameCycle ? ob.payday : ob.cycle; if(ob.save){ state.settings.savingsTarget = ob.save; state.settings.jarsMigrated = true; if(!jarList().length) put.jar({ id: uid(), name: "儲蓄", freq: "month", amount: ob.save, day: ob.payday, base: 0, since: todayStr(), createdAt: Date.now() }); }
    // salary as a fixed income; if this month's payday has passed, the first reminder is next month's
    if(ob.income){ const now = new Date(); const pay = Object.values(state.categories).find(c => c.type === "income" && c.name === "薪資");
      const first = now.getDate() >= ob.payday ? new Date(now.getFullYear(), now.getMonth() + 1, 1) : now;
      put.rec({ id: uid(), title: "薪資", amount: ob.income, type: "income", categoryId: pay ? pay.id : null, day: ob.payday, active: true, startMonth: `${first.getFullYear()}-${pad(first.getMonth()+1)}` }); }
    viewPeriod = curPeriod();
  };
  draw();
}
// 使用說明: swipeable cards; also the last step of onboarding
function openGuide(afterSetup, onDone){
  const local = !db;
  // each card shows a small, non-interactive piece of the real UI (built from the app's own classes, so it follows theme & palette)
  const ok = `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`;
  const V = {
    rec: `<div class="home gdrow"><button class="qchip"><span class="qic tint3">${icon("coffee")}</span><span class="qt"><b>早餐</b><span class="num">85</span></span></button><button class="qchip"><span class="qic tint8">${icon("bus")}</span><span class="qt"><b>捷運</b><span class="num">30</span></span></button><span class="gdfab">${icon("plus")}</span></div>`,
    flex: `<div class="hcard alertc"><div class="trow"><span class="qic tint5">${icon("basket")}</span><div class="meta"><b class="nmrow"><span class="t">日常用品</span><span class="tag over">超支</span></b><span class="num">超出 NT$1,358</span></div><button class="btn small">處理</button></div></div>
      <div class="gdopts"><span>跟其他類別借</span><span>跟下個月借</span><span>動用已節省結餘</span><span>動用存錢罐</span></div>`,
    wish: `<div class="card wish"><div class="w0"><span class="wst ok">可以買</span><span class="num wprice">NT$1,290</span></div><div class="wmain"><b>藍牙耳機</b><span class="wmeta">娛樂 · 想要 · 已放 8 天</span></div><p class="wimpact">買了之後，娛樂本期可用 <span class="num">NT$3,000</span> → <b class="num">NT$1,710</b></p></div>`,
    fixed: `<div class="hcard"><div class="trow"><span class="qic tint2">${icon("coin")}</span><div class="meta"><b>薪資</b><span>10/5 待確認</span></div><span class="amtin num gdamt">40,000</span><span class="okbtn">${ok}</span></div>
      <div class="trow"><span class="qic tint4">${icon("phone")}</span><div class="meta"><b>新手機</b><span>10/1 · 分期 2/12</span></div><div class="upr"><b class="num">−2,075</b><small>3 天後</small></div></div></div>`,
    // two places, one idea: tag while recording (step 1), see the split in 看懂 (step 2); a short loop picks 想要 and the bar fills
    nw: `<div class="gdstep"><span class="gdnum">1</span>記一筆時標記</div>
      <div class="card gdpad"><div class="nwrow"><span>這筆是</span><div class="nwseg"><span class="nwb must">必要</span><span class="nwb need">需要</span><span class="nwb want gdpick">想要</span></div></div></div>
      <div class="gdstep"><span class="gdnum">2</span>在看懂看比例</div>
      <div class="card gdpad"><div class="nwbar gdgrow"><i class="must" style="--w:46%"></i><i class="need" style="--w:32%"></i><i class="want" style="--w:22%"></i></div>
        <div class="gdleg"><span><i class="sw must"></i>必要 46%</span><span><i class="sw need"></i>需要 32%</span><span><i class="sw want"></i>想要 22%</span></div></div>`,
    jar: `<div class="card setlist"><div class="catrow"><b>旅行</b><span class="num small">18,000</span><span class="sub">每年 12/1 存 12,000</span><span class="sub">目標 30,000 · 約 2027/12 存到</span><span class="jbar"><i style="width:60%"></i></span></div></div>`,
    data: `<div class="card setlist"><div class="setrow"><div class="k"><b>匯出備份</b><span>JSON 檔，之後可以匯入還原</span></div><span class="btn small">匯出</span></div></div>`
  };
  // each card: an optional one-line lead, then short points (bold = the words to look for in the app)
  const cards = [
    { v: V.rec, h: "記一筆，也能一點就記", pts: ["常記的東西<b>存成常用</b>，之後一點就記好", "同一筆記了 3 次，App 會問你要不要<b>存成常用</b>", "金額旁的<b>計算機</b>：拆帳、加總直接算"], where: ["{plus}記一筆", "首頁 → 快速記帳"] },
    { v: V.flex, h: "預算有彈性，超支也不慌", lead: "某一類超支時，可以這樣補：", pts: ["跟<b>其他類別</b>借，或跟<b>下個月</b>借", "動用<b>已節省結餘</b>：每期沒用完的預算會存進來", "都不夠時，才動用<b>存錢罐</b>這期該存的錢"], where: ["首頁 → 需要注意", "看懂 → 預算進度"] },
    { v: V.wish, h: "想買的，先放 7 天", pts: ["想買的先放著冷靜幾天", "App 會告訴你<b>可以買</b>、<b>再等等</b>，還是會影響本期預算", "決定買了，按<b>「買了」</b>就直接記帳"], where: ["下方「想買」分頁"] },
    { v: V.jar, h: "存錢罐：分開存，存到就能用", pts: ["依用途分開存，<b>每週、每月或每年</b>自動存一筆", "可以設<b>目標金額</b>，算出大概什麼時候存到", "<b>使用這筆錢</b>由存錢罐支付，不動到預算", "也能<b>存一筆</b>、轉到其他存錢罐，每筆進出都有<b>紀錄</b>"], where: ["{gear}設定 → 預算與儲蓄 → 儲蓄"] },
    { v: V.fixed, h: "固定收支與分期", pts: ["房租、電信、薪資這類固定的，到期會提醒你<b>確認</b>", "<b>分期付款</b>會先占用之後每一期的額度", "「今天可以花」會先扣掉這期<b>還沒付的</b>"], where: ["{gear}設定 → 固定收支與分期", "{plus}記一筆 → 分期付款"] },
    { v: V.nw, h: "必要、需要、想要", pts: ["記帳時標記這筆是<b>必要、需要還是想要</b>", "「看懂」會算出<b>想要占多少</b>", "用必要支出推算<b>緊急預備金</b>該存多少"], where: ["{plus}記一筆 → 這筆是", "看懂 → 收支分析"] },
    { v: V.data, h: local ? "資料只存在這台手機" : "記得偶爾備份", pts: local
        ? ["沒有雲端帳號，<b>換手機或清除瀏覽器資料就會不見</b>", "記得定期<b>匯出備份</b>，App 每兩週提醒一次", "設定過的每一項，都能在右上角<b>設定</b>裡改"]
        : ["資料會在這個頁面同步", "還是建議偶爾<b>匯出備份</b>", "設定過的每一項，都能在右上角<b>設定</b>裡改"], where: ["{gear}設定 → 資料與備份"] }
  ];
  const el = obShell(`<div class="obtop"><span></span><div class="obdots" id="gd-dots">${cards.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div><button class="link" data-gd="done">${afterSetup ? "略過" : "關閉"}</button></div>
    <p class="gdtitle">${afterSetup ? "設定好了，看看還能怎麼用" : "使用說明"}</p>
    <div class="gdcards" id="gd-cards">${cards.map((c, i) => `<section class="gdcard" aria-label="${i+1} / ${cards.length}：${c.h}">
      <div class="gdviz" aria-hidden="true">${c.v}</div><h3>${c.h}</h3>${c.lead ? `<p class="gdlead">${c.lead}</p>` : ""}<ul class="gdpts">${c.pts.map(x => `<li>${x}</li>`).join("")}</ul>
      <div class="gdpath"><span class="lbl">在哪裡</span>${c.where.map(w => `<span class="pth">${w.replace("{plus}", icon("plus")).replace("{gear}", icon("gear"))}</span>`).join("")}</div></section>`).join("")}</div>
    <div class="obfoot gdfoot"><button class="btn" data-gd="prev">上一張</button><button class="btn primary" data-gd="next">下一張</button></div>`);
  const box = $("#gd-cards", el); let at = 0;
  const sync = () => { at = Math.round(box.scrollLeft / box.clientWidth);
    el.querySelectorAll("#gd-dots i").forEach((d, i) => d.className = i === at ? "on" : i < at ? "done" : "");
    $('[data-gd="prev"]', el).disabled = at === 0;
    $('[data-gd="next"]', el).textContent = at === cards.length - 1 ? (afterSetup ? "開始使用" : "完成") : "下一張"; };
  const done = () => { obClose(); if(onDone) onDone(); };
  box.addEventListener("scroll", () => requestAnimationFrame(sync));
  el.querySelector('[data-gd="done"]').addEventListener("click", done);
  el.querySelector('[data-gd="prev"]').addEventListener("click", () => box.scrollTo({ left: (at - 1) * box.clientWidth, behavior: "smooth" }));
  el.querySelector('[data-gd="next"]').addEventListener("click", () => { if(at === cards.length - 1) done(); else box.scrollTo({ left: (at + 1) * box.clientWidth, behavior: "smooth" }); });
  sync();
}

/* ---------- boot ---------- */
loadLocal();
viewPeriod = curPeriod();
render();
connectDb();

/* ---------- standalone PWA: offline cache + keep local data ---------- */
if(!window.claude && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
})();
