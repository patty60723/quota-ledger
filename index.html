<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#463F3A">
<meta name="description" content="幫自己控制衝動消費的記帳 App">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="額度帳本">
<style>
  /* 獨立 PWA 版的基本設定（claude.ai 發佈版由平台提供） */
  body{margin:0}
  [hidden]{display:none!important}
  img{max-width:100%}
  :root{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<title>額度帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#EEF3F1; --surface:#FFFFFF; --sunk:#E3EAE7; --ink:#18293A; --muted:#58686F; --faint:#8A989D;
  --line:#D2DCD8; --accent:#0B6E66; --accent-ink:#FFFFFF; --accent-soft:#D6EBE7;
  --income:#008C7E; --expense:#C27C12; --warn:#9A6408; --warn-soft:#F6E9CF;
  --stamp:#C0392B; --stamp-soft:#F8DEDA;
  --shadow:0 1px 2px rgba(24,41,58,.06),0 8px 24px rgba(24,41,58,.08);
  --bar:var(--accent); --pos:var(--income); --fab-bg:var(--accent); --fab-ink:var(--accent-ink);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-display:"LXGW WenKai TC","Noto Serif TC","Kaiti TC",serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0E1719; --surface:#152124; --sunk:#1C2B2F; --ink:#E2EBE9; --muted:#9DB0B3; --faint:#6F8487;
    --line:#29393D; --accent:#3FB3A6; --accent-ink:#06201D; --accent-soft:#17383A;
    --income:#1FA396; --expense:#C98316; --warn:#E0A94A; --warn-soft:#3A2E17;
    --stamp:#EE7466; --stamp-soft:#3D1F1C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1719; --surface:#152124; --sunk:#1C2B2F; --ink:#E2EBE9; --muted:#9DB0B3; --faint:#6F8487;
  --line:#29393D; --accent:#3FB3A6; --accent-ink:#06201D; --accent-soft:#17383A;
  --income:#1FA396; --expense:#C98316; --warn:#E0A94A; --warn-soft:#3A2E17;
  --stamp:#EE7466; --stamp-soft:#3D1F1C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
/* 奶茶配色：Taupe #463F3A · Grey Olive #8A817C · Silver #BCB8B1 · Parchment #F4F3EE · Powder Blush #E0AFA0 */
:root[data-palette="blush"]{
  --paper:#F4F3EE; --surface:#FFFFFF; --sunk:#ECE9E3; --ink:#463F3A; --muted:#6F6762; --faint:#8A817C;
  --line:#DDD9D2; --accent:#463F3A; --accent-ink:#F4F3EE; --accent-soft:#F3E1DA;
  --bar:#8A817C; --pos:#3D72A8; --income:#3D72A8; --expense:#C26A50; --warn:#8A6220; --warn-soft:#F2E6CF;
  --stamp:#B0473A; --stamp-soft:#F6DED8; --fab-bg:#E0AFA0; --fab-ink:#463F3A;
  --shadow:0 1px 2px rgba(70,63,58,.06),0 8px 24px rgba(70,63,58,.10);
}
@media (prefers-color-scheme:dark){
  :root[data-palette="blush"]:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1F1B18; --surface:#29241F; --sunk:#332D28; --ink:#F4F3EE; --muted:#BCB8B1; --faint:#8A817C;
    --line:#3E3731; --accent:#E0AFA0; --accent-ink:#2A2420; --accent-soft:#45322C;
    --bar:#BCB8B1; --pos:#8DB4DE; --income:#4C80B8; --expense:#C9735A; --warn:#DDAE5C; --warn-soft:#3D3120;
    --stamp:#EE8C7A; --stamp-soft:#48261F; --fab-bg:#E0AFA0; --fab-ink:#2A2420;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-palette="blush"][data-theme="dark"]{
  color-scheme:dark;
  --paper:#1F1B18; --surface:#29241F; --sunk:#332D28; --ink:#F4F3EE; --muted:#BCB8B1; --faint:#8A817C;
  --line:#3E3731; --accent:#E0AFA0; --accent-ink:#2A2420; --accent-soft:#45322C;
  --bar:#BCB8B1; --pos:#8DB4DE; --income:#4C80B8; --expense:#C9735A; --warn:#DDAE5C; --warn-soft:#3D3120;
  --stamp:#EE8C7A; --stamp-soft:#48261F; --fab-bg:#E0AFA0; --fab-ink:#2A2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 150px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:8px 4px}
.brand{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.04em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.on i{background:var(--income)}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;text-wrap:balance}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* period nav */
.period{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.period .t{display:flex;flex-direction:column;align-items:center}
.period .t b{font-family:var(--f-display);font-size:20px}
.period .t span{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.iconbtn:disabled{opacity:.35;cursor:default}

/* summary passbook strip */
.passbook{margin-top:14px;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  background:linear-gradient(var(--surface),var(--surface)) padding-box;position:relative;overflow:hidden}
.passbook::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 27px,var(--sunk) 27px 28px);opacity:.6;pointer-events:none}
.passbook > div{position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.passbook .v{font-family:var(--f-num);font-size:clamp(15px,4.4vw,20px);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.passbook .v.neg{color:var(--stamp)}
.weekline{font-size:13px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* pending recurring */
.pending{display:flex;flex-direction:column}
.pending .row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.pending .row:first-child{border-top:0}
.pending .meta{display:flex;flex-direction:column;min-width:0}
.pending .acts{display:flex;gap:6px;align-items:center;grid-column:1 / -1}
.amtin{width:100%;max-width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--f-num);text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.block{width:100%;padding:12px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.inc{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.over{background:var(--stamp-soft);color:var(--stamp)}

/* budgets */
.budgets{display:flex;flex-direction:column}
.bud{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.bud:first-child{border-top:0}
.bud .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bud .l1 .n{font-weight:500;display:flex;gap:6px;align-items:center;min-width:0}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--bar);max-width:100%}
.bar.warn > i{background:var(--warn)}
.bar.over > i{background:var(--stamp)}
.bud .l2{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.stamp{display:inline-block;font-family:var(--f-display);font-weight:700;color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:0 5px;font-size:13px;line-height:1.4;transform:rotate(-8deg);letter-spacing:.1em}

/* tx list */
.txlist{display:flex;flex-direction:column}
.daygrp{display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.daygrp:first-child{border-top:0}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;background:none;border:0;text-align:left;width:100%}
.tx:hover{background:var(--sunk)}
.tx .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;background:var(--sunk);color:var(--ink)}
.tx .dot.inc{background:var(--accent-soft);color:var(--accent)}
.tx .mid{display:flex;flex-direction:column;min-width:0}
.tx .mid b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.tx .amt.inc{color:var(--pos)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}

/* report */
.rank{display:flex;flex-direction:column;gap:10px;padding:14px}
.rank .r{display:grid;grid-template-columns:5.5em 1fr auto;gap:10px;align-items:center;font-size:14px}
.rank .r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .track{height:14px;position:relative}
.rank .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--expense);min-width:2px}
.rank .r .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;text-align:right;white-space:nowrap}
.rank .r .v small{color:var(--muted);margin-left:6px}
.chartbox{padding:14px;position:relative}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.trend{width:100%;height:auto;display:block;overflow:visible}
svg.trend text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.trend .grid{stroke:var(--line);stroke-width:1}
svg.trend .hit{fill:transparent}
svg.trend .col.hover .hit{fill:var(--sunk)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:8px 10px;border-radius:8px;line-height:1.5;white-space:nowrap;box-shadow:var(--shadow);transform:translate(-50%,-100%);z-index:3}
.tip .num{display:block}
details.tbl{padding:0 14px 14px}
details.tbl summary{cursor:pointer;font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}

/* settings */
.setlist{display:flex;flex-direction:column}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .k{display:flex;flex-direction:column;min-width:0}
.setrow .k span{font-size:12px;color:var(--muted)}
select,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-width:0}
.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.catrow:first-child{border-top:0}
.catrow .sub{font-size:12px;color:var(--muted);grid-column:1}
.catrow.arch{opacity:.5}
.issues{font-size:13px;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.note{font-size:13px;color:var(--muted);padding:12px 14px;border-top:1px solid var(--line)}
textarea.backup{width:100%;min-height:120px;font-family:var(--f-num);font-size:11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px}

/* tabbar + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-family:var(--f-display);font-size:17px;font-weight:400;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:18px;border:0;background:var(--fab-bg);color:var(--fab-ink);font-size:30px;line-height:1;box-shadow:var(--shadow)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.amount span{font-family:var(--f-num);color:var(--muted)}
.amount input{border:0;background:none;font-family:var(--f-num);font-size:34px;font-weight:600;width:100%;outline:none;font-variant-numeric:tabular-nums;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.hint{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.hint.ok{background:var(--accent-soft);color:var(--accent)}
.hint.warn{background:var(--warn-soft);color:var(--warn)}
.hint.over{background:var(--stamp-soft);color:var(--stamp)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label,.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fields .full{grid-column:1 / -1}
.fields input,.fields select,.field input,.field select{font-size:15px;color:var(--ink);width:100%;min-width:0}
.fields > *{min-width:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.toggle input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.toggle input:disabled + *,.toggle:has(input:disabled){color:var(--faint)}
.rowbtns{display:flex;gap:8px}
.rowbtns .btn{flex:1;padding:12px}
.rowbtns + .rowbtns{margin-top:-6px}
.bud .l3{font-size:12px;color:var(--muted)}
.bud .l3.bad{color:var(--stamp)}
.instbox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.opt:first-child{border-top:0}
.opt .k{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.opt .k span{font-size:12px;color:var(--muted)}
.optrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.optrow select{max-width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn,.setrow > .num{white-space:nowrap}
.setrow > .num{flex-shrink:0}
.sheet .hint + .hint{margin-top:-6px}
.sheet table td,.sheet table th{font-size:13px}
.catrow .small{justify-self:end}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;min-width:0}
.qbtn b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qbtn .num{font-size:17px;font-weight:600}
.qbtn:active{background:var(--sunk)}
.qbtn.off{opacity:.5}
.favbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.chip.fav{white-space:nowrap;background:var(--accent-soft);border-color:transparent}
.chip.fav .num{font-size:12px;opacity:.8}
.favitem{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px 10px 8px 0;border-top:1px solid var(--line)}
.favitem:first-child{border-top:0}
.favitem.arch .favmain{opacity:.55}
.favmain{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:4px 14px;background:none;border:0;text-align:left;min-width:0}
.favmain .sub{font-size:12px;color:var(--muted)}
.iconbtn.sm{width:34px;height:34px;border-radius:10px;font-size:15px}
.wishes{display:flex;flex-direction:column;gap:10px}
.wish{padding:14px;display:flex;flex-direction:column;gap:10px}
.wish .w1{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.wscore{width:46px;height:46px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:18px;font-weight:600}
.wmain{display:flex;flex-direction:column;min-width:0}
.wmain b{font-weight:500}
.wprice{font-weight:600}
.wacts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.wacts a.btn{text-decoration:none;color:var(--ink)}
.wish .hint{font-size:13px;padding:8px 10px}
details.bought summary{padding:12px 14px;cursor:pointer}
.toast{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="主選單"><div class="in" id="tabs"></div></nav>
<button class="fab" id="fab" aria-label="記一筆">＋</button>
<div id="overlay"></div>
<div id="toastHost"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dim = (y,m) => new Date(y, m, 0).getDate(); // m: 1-12
const money = n => "NT$ " + Math.round(n).toLocaleString("zh-TW");
const moneyShort = n => Math.round(n).toLocaleString("zh-TW");
const todayStr = () => ymd(new Date());
const intOf = v => { const n = parseInt(String(v ?? "").replace(/\D/g,""), 10); return n > 0 ? n : null; };
const WEEK = ["日","一","二","三","四","五","六"];

/* ---------- state ---------- */
const DEFAULT_CATS = [
  ["一般用餐","expense"],["交通","expense"],["娛樂","expense"],["服飾","expense"],["日常用品","expense"],
  ["水電瓦斯","expense"],["手機網路","expense"],["醫療與健康","expense"],["訂閱","expense"],["其他支出","expense"],
  ["薪資","income"],["其他收入","income"]
].map(([name,type],i)=>({id:"d"+i,name,type,monthlyLimit:null,perTxLimit:null,dailyLimit:null,yearlyLimit:null,warn:false,archived:false,sort:i}));
const DEFAULT_SETTINGS = { weekStart: 1, cycleStartDay: 1, savingsTarget: 0, savingsStart: null, palette: "blush", favManual: false, favDismissed: [] };
const PALETTES = { blush: { name: "奶茶", bar: "#463F3A" }, teal: { name: "存摺綠", bar: "#0B6E66" } };
// collections stored one document per item
const COLS = ["categories","recurring","runs","installments","adjustments","closings","favorites","wishes"];

let state = { ...Object.fromEntries(COLS.map(n => [n, {}])), months: {}, settings: {...DEFAULT_SETTINGS} };
DEFAULT_CATS.forEach(c => state.categories[c.id] = c);
let usingDefaults = true;

const LS_KEY = "ledger.v1";
const clone = o => JSON.parse(JSON.stringify(o));
function normalize(s){
  const out = { months: s.months || {}, settings: Object.assign({}, DEFAULT_SETTINGS, s.settings || {}) };
  COLS.forEach(n => out[n] = s[n] || {});
  return out;
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(!raw) return false;
    const s = JSON.parse(raw); if(s && s.categories){ state = normalize(s); usingDefaults = false; return true; } }catch(e){}
  return false;
}

/* ---------- storage: db when available, localStorage otherwise ---------- */
let db = null;
const chains = new Map();
function write(path, body){
  saveLocal();
  if(!db) return Promise.resolve();
  const prev = chains.get(path) || Promise.resolve();
  const next = prev.catch(()=>{}).then(() => body === null ? db.doc(path).delete() : db.doc(path).set(body))
    .catch(e => { toast(e && e.code === "quota_exceeded" ? "雲端空間已滿，資料只存在這個瀏覽器" : "同步失敗，資料先存在這個瀏覽器"); });
  chains.set(path, next);
  return next;
}
function persistSeedIfNeeded(){
  if(!usingDefaults) return;
  usingDefaults = false;
  Object.values(state.categories).forEach(c => write("categories/"+c.id, c));
}
function putDoc(col, id, v){ persistSeedIfNeeded(); state[col][id] = v; return write(col+"/"+id, v); }
function delDoc(col, id){ delete state[col][id]; return write(col+"/"+id, null); }
const put = {
  cat: c => putDoc("categories", c.id, c),
  rec: r => putDoc("recurring", r.id, r),
  recDel: id => delDoc("recurring", id),
  run: (key, v) => putDoc("runs", key, v),
  inst: i => putDoc("installments", i.id, i),
  instDel: id => delDoc("installments", id),
  adj: a => putDoc("adjustments", a.id, a),
  adjDel: id => delDoc("adjustments", id),
  closing: (k, v) => putDoc("closings", k, v),
  fav: f => putDoc("favorites", f.id, f),
  favDel: id => delDoc("favorites", id),
  wish: w => putDoc("wishes", w.id, w),
  wishDel: id => delDoc("wishes", id),
  month: ym => { persistSeedIfNeeded(); const items = state.months[ym] || []; return write("months/"+ym, items.length ? {items} : null); },
  settings: () => { persistSeedIfNeeded(); return write("meta/settings", state.settings); }
};

async function connectDb(){
  let d = null;
  try{ d = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ d = null; }
  if(!d){ setSync(false); afterLoad(); return; }
  db = d;
  const names = [...COLS, "months", "meta"]; const loaded = {}; const fresh = {};
  let first = true;
  const applyFresh = () => {
    COLS.forEach(n => { state[n] = clone(fresh[n] || {}); });
    const m = {}; Object.entries(fresh.months || {}).forEach(([k,v]) => m[k] = (v.items||[]).map(x=>({...x}))); state.months = m;
    if(fresh.meta && fresh.meta.settings) state.settings = Object.assign({}, DEFAULT_SETTINGS, fresh.meta.settings);
    if(!Object.keys(state.categories).length) DEFAULT_CATS.forEach(c => state.categories[c.id] = c);
  };
  const done = () => {
    if(!names.every(n => loaded[n])) return;
    if(first){
      first = false;
      const empty = ["categories","months","recurring","installments"].every(n => !Object.keys(fresh[n] || {}).length);
      if(empty){
        // nothing in the cloud yet: keep what this browser has and push it up if it's real data
        if(!usingDefaults) pushAll();
        setSync(true); render(); afterLoad(); return;
      }
      usingDefaults = false; applyFresh(); render(); saveLocal(); afterLoad(); return;
    }
    applyFresh(); render(); saveLocal();
  };
  names.forEach(n => db.collection(n).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(doc => { const v = doc.data(); if(v) o[doc.id] = v; });
    fresh[n] = o; loaded[n] = true; setSync(true); done();
  }, () => setSync(false)));
}
function pushAll(){
  COLS.forEach(n => Object.entries(state[n]).forEach(([id,v]) => write(n+"/"+id, v)));
  Object.keys(state.months).forEach(ym => put.month(ym));
  write("meta/settings", state.settings);
}
let syncOn = false;
function setSync(on){ syncOn = on; const el = $("#sync"); if(el){ el.className = "sync" + (on?" on":""); el.lastElementChild.textContent = on ? "已同步" : "只存在這個瀏覽器"; } }

/* ---------- periods ---------- */
function cycleStart(y, m){ const S = state.settings.cycleStartDay || 1; return new Date(y, m-1, Math.min(S, dim(y,m))); }
function periodOf(dateStr){
  const d = parseYmd(dateStr); let y = d.getFullYear(), m = d.getMonth()+1;
  if(d < cycleStart(y,m)){ m--; if(m<1){m=12;y--;} }
  return {y,m};
}
function shift(p, n){ let y = p.y, m = p.m + n; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return {y,m}; }
const pkey = p => `${p.y}-${pad(p.m)}`;
const fromKey = k => { const [y,m] = k.split("-").map(Number); return {y,m}; };
const monthsBetween = (a,b) => (b.y-a.y)*12 + (b.m-a.m);
function periodRange(p){
  const start = cycleStart(p.y,p.m); const nx = shift(p,1);
  const end = new Date(cycleStart(nx.y,nx.m)); end.setDate(end.getDate()-1);
  return [ymd(start), ymd(end)];
}
function periodLabel(p){
  const [a,b] = periodRange(p); const f = s => { const d = parseYmd(s); return `${d.getMonth()+1}/${d.getDate()}`; };
  return { title: (state.settings.cycleStartDay||1) === 1 ? `${p.y} 年 ${p.m} 月` : `${p.y} 年 ${p.m} 月期`, short: `${p.m} 月期`, range: `${f(a)}–${f(b)}` };
}
const samePeriod = (a,b) => a.y===b.y && a.m===b.m;
const curPeriod = () => periodOf(todayStr());

/* ---------- transactions ---------- */
// Amount a transaction adds to its category's spending: refunds count against it.
const outAmt = t => t.type==="expense" ? t.amount : t.type==="refund" ? -t.amount : 0;
function realTx(){ return Object.values(state.months).flat(); }
function instAmount(inst, k){ return k===0 ? inst.first : inst.per; }
// Installment portions are generated, not stored: one per period, adjusted for early payoff or cancellation.
function instPortions(inst){
  const out = []; const start = fromKey(inst.startPeriod);
  const endIdx = inst.status !== "active" && inst.endPeriod ? Math.max(0, monthsBetween(start, fromKey(inst.endPeriod))) : null;
  for(let k=0; k<inst.n; k++){
    let amt = instAmount(inst, k), note = "";
    if(endIdx !== null && k > endIdx) break;
    if(inst.status === "paidoff" && k === endIdx){ amt = 0; for(let j=k; j<inst.n; j++) amt += instAmount(inst, j); note = "提前還清"; }
    const p = shift(start, k);
    out.push({ id: `inst-${inst.id}-${k}`, date: k===0 ? inst.date : ymd(cycleStart(p.y,p.m)), type: "expense", categoryId: inst.categoryId, amount: amt,
      title: `${inst.title}（分期 ${k+1}/${inst.n}）`, note, installmentId: inst.id, k, virtual: true, createdAt: inst.createdAt || 0 });
  }
  return out;
}
function allTx(){ return realTx().concat(Object.values(state.installments).flatMap(instPortions)); }
function txIn(p){ const [a,b] = periodRange(p); return allTx().filter(t => t.date >= a && t.date <= b); }
function cats(type){ return Object.values(state.categories).filter(c => !c.archived && (!type || c.type===type)).sort((a,b)=>(a.sort??0)-(b.sort??0)); }
function catName(id){ return state.categories[id]?.name || "未分類"; }
const sumIncome = l => l.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
const sumOut = l => l.reduce((s,t)=>s+outAmt(t),0);
function usageOrder(type){
  const since = new Date(); since.setDate(since.getDate()-90); const s = ymd(since);
  const cnt = {}; realTx().forEach(t => { if(t.date>=s) cnt[t.categoryId] = (cnt[t.categoryId]||0)+1; });
  return cats(type).sort((a,b) => (cnt[b.id]||0)-(cnt[a.id]||0) || (a.sort??0)-(b.sort??0));
}
function addTx(t){ const ym = t.date.slice(0,7); (state.months[ym] ||= []).push(t); return put.month(ym); }
function removeTx(t, dropAdjustments){
  const ym = t.date.slice(0,7); state.months[ym] = (state.months[ym]||[]).filter(x => x.id!==t.id);
  if(dropAdjustments) dropAdjFor(t.id);
  return put.month(ym);
}
function dropAdjFor(id){ Object.values(state.adjustments).filter(a => a.txId===id).forEach(a => put.adjDel(a.id)); }
function findTx(id){ return realTx().find(t => t.id===id); }

/* ---------- budgets ---------- */
// cap = monthly limit + borrowed in; used = actual + installment portions + occupied (lent out or borrowed by an earlier period)
function budgetOf(c, p, excludeId){
  const list = txIn(p).filter(t => t.categoryId===c.id && t.id!==excludeId);
  const actual = list.filter(t => !t.virtual).reduce((s,t)=>s+outAmt(t),0);
  const inst = list.filter(t => t.virtual).reduce((s,t)=>s+t.amount,0);
  const k = pkey(p); let received = 0, occupied = 0;
  Object.values(state.adjustments).forEach(a => { if(a.categoryId===c.id && a.period===k){ if(a.amount>0) received += a.amount; else occupied -= a.amount; } });
  const limit = c.monthlyLimit || 0; const cap = limit + received; const used = actual + inst + occupied;
  return { limit, received, actual, inst, occupied, cap, used, avail: cap - used };
}
function dayUsed(c, date, excludeId){ return realTx().concat(Object.values(state.installments).flatMap(instPortions)).filter(t => t.categoryId===c.id && t.date===date && t.id!==excludeId).reduce((s,t)=>s+outAmt(t),0); }
function yearUsed(c, y, excludeId){ const a = `${y}-01-01`, b = `${y}-12-31`; return allTx().filter(t => t.categoryId===c.id && t.date>=a && t.date<=b && t.id!==excludeId).reduce((s,t)=>s+outAmt(t),0); }
const toPool = c => c.type==="expense" && !!c.monthlyLimit && (c.toPool ?? !!c.warn);
function poolBalance(){
  const inTotal = Object.values(state.closings).reduce((s,c)=>s+(c.total||0),0);
  const used = Object.values(state.adjustments).filter(a => a.kind==="pool").reduce((s,a)=>s+a.amount,0);
  return inTotal - used;
}
function recordedMonths(){
  const dates = realTx().map(t=>t.date).filter(d => d <= todayStr()).sort();
  if(!dates.length) return 0;
  return monthsBetween(periodOf(dates[0]), curPeriod()) + 1;
}
function yearlyRef(c){
  const n = recordedMonths(); if(!n) return null;
  const total = allTx().filter(t => t.categoryId===c.id && t.date <= todayStr()).reduce((s,t)=>s+outAmt(t),0);
  return { n, perYear: total / n * 12 };
}

/* ---------- period closing: unused budget moves into savings ---------- */
let loadedOnce = false;
function afterLoad(){ if(loadedOnce) return; loadedOnce = true; closePeriods(); }
function closePeriods(){
  const ck = pkey(curPeriod());
  if(!state.settings.savingsStart){ state.settings.savingsStart = ck; put.settings(); return; }
  let p = fromKey(state.settings.savingsStart), guard = 0, changed = false;
  while(pkey(p) < ck && guard++ < 60){
    const k = pkey(p);
    if(!state.closings[k]){
      const perCat = {}; let total = 0;
      // a period with no records at all means the app wasn't used; don't count its whole budget as saved
      if(txIn(p).length) cats("expense").forEach(c => { if(toPool(c)){ const s = Math.max(0, budgetOf(c, p).avail); if(s > 0){ perCat[c.id] = s; total += s; } } });
      put.closing(k, { period: k, perCat, total, at: Date.now() }); changed = true;
    }
    p = shift(p, 1);
  }
  if(changed) render();
}

/* ---------- recurring ---------- */
function pendingRecurring(){
  const out = []; const today = todayStr(); const now = new Date();
  const curYm = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  Object.values(state.recurring).forEach(r => {
    if(!r.active) return;
    let [y,m] = (r.startMonth || curYm).split("-").map(Number);
    let guard = 0;
    while(`${y}-${pad(m)}` <= curYm && guard++ < 36){
      const due = ymd(new Date(y, m-1, Math.min(r.day||1, dim(y,m))));
      const key = `${r.id}_${y}-${pad(m)}`;
      if(due <= today && !state.runs[key]) out.push({r, key, due});
      m++; if(m>12){m=1;y++;}
    }
  });
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}

/* ---------- overspend ---------- */
// subject: {kind:"tx"|"inst", id, categoryId, date, title}
function subjectOf(kind, id){
  if(kind==="tx"){ const t = findTx(id); return t && { kind, id, categoryId: t.categoryId, date: t.date, title: t.title || catName(t.categoryId), amount: t.amount }; }
  const i = state.installments[id]; return i && { kind, id, categoryId: i.categoryId, date: i.date, title: i.title, amount: i.total };
}
function overOf(s){ const c = state.categories[s.categoryId]; if(!c || !c.monthlyLimit) return 0; return Math.max(0, -budgetOf(c, periodOf(s.date)).avail); }
function setPending(s, on){
  if(s.kind==="tx"){ const t = findTx(s.id); if(!t) return; const ym = t.date.slice(0,7);
    state.months[ym] = state.months[ym].map(x => x.id===t.id ? {...x, pendingOverspend: on || undefined} : x); put.month(ym); }
  else { const i = state.installments[s.id]; if(i) put.inst({...i, pendingOverspend: on || undefined}); }
}
function pendingOverspends(){
  const list = realTx().filter(t => t.pendingOverspend).map(t => subjectOf("tx", t.id));
  Object.values(state.installments).filter(i => i.pendingOverspend).forEach(i => list.push(subjectOf("inst", i.id)));
  return list.filter(Boolean);
}
function resolveOver(s, choice, fromId){
  const c = state.categories[s.categoryId]; const p = periodOf(s.date); const k = pkey(p);
  const over = overOf(s); const base = { txId: s.id, at: Date.now() };
  if(over > 0){
    if(choice==="cat"){
      put.adj({ ...base, id: uid(), period: k, categoryId: c.id, amount: over, kind: "borrow-cat", peer: fromId });
      put.adj({ ...base, id: uid(), period: k, categoryId: fromId, amount: -over, kind: "borrow-cat", peer: c.id });
    } else if(choice==="next"){
      put.adj({ ...base, id: uid(), period: k, categoryId: c.id, amount: over, kind: "borrow-next" });
      put.adj({ ...base, id: uid(), period: pkey(shift(p,1)), categoryId: c.id, amount: -over, kind: "borrow-next" });
    } else if(choice==="pool"){
      put.adj({ ...base, id: uid(), period: k, categoryId: c.id, amount: over, kind: "pool" });
    }
  }
  setPending(s, false);
}
function openOverspend(s){
  const c = state.categories[s.categoryId]; const p = periodOf(s.date); const L = periodLabel(p);
  const over = overOf(s);
  if(!over){ setPending(s, false); render(); toast("已經沒有超支了"); return; }
  const lenders = cats("expense").filter(x => x.id!==c.id && x.monthlyLimit).map(x => ({x, left: budgetOf(x, p).avail})).filter(o => o.left >= over).sort((a,b)=>b.left-a.left);
  const next = shift(p,1); const nb = budgetOf(c, next); const pool = poolBalance();
  openSheet(`<div class="hd"><h2>超出預算了</h2><button class="btn ghost" data-x>稍後處理</button></div>
    <div class="hint over">${s.title && s.title!==c.name ? `「${esc(s.title)}」` : "這筆支出"}讓${esc(c.name)}在 ${L.title} 超出 <b class="num">${money(over)}</b>。這筆錢要從哪裡補？</div>
    <div class="opts">
      <div class="opt"><div class="k"><b>跟其他類別借</b><span>本期那個類別的額度會少 ${moneyShort(over)}</span></div>
        ${lenders.length ? `<div class="optrow"><select id="o-cat" aria-label="借用的類別">${lenders.map(o=>`<option value="${esc(o.x.id)}">${esc(o.x.name)}（還剩 ${moneyShort(o.left)}）</option>`).join("")}</select><button class="btn" data-o="cat">借這個</button></div>`
          : `<span class="small muted">沒有類別還剩 ${moneyShort(over)} 以上</span>`}</div>
      <div class="opt"><div class="k"><b>跟下個月借</b><span>${esc(c.name)}在 ${next.m} 月期${nb.avail - over >= 0 ? `會剩 ${moneyShort(nb.avail - over)}` : `會超出 ${moneyShort(over - nb.avail)}`}</span></div><button class="btn" data-o="next">借下個月</button></div>
      <div class="opt"><div class="k"><b>動用已節省結餘</b><span>目前結餘 ${moneyShort(pool)}${pool>=over?`，動用後剩 ${moneyShort(pool-over)}`:"，不夠補這筆"}</span></div><button class="btn" data-o="pool" ${pool>=over?"":"disabled"}>動用結餘</button></div>
    </div>
    <p class="small muted" style="margin:0">先不決定的話，這筆會留在首頁「待處理的超支」。</p>`, sheet => {
    $("[data-x]", sheet).addEventListener("click", () => { closeSheet(); render(); });
    sheet.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => {
      const ch = b.dataset.o; resolveOver(s, ch, ch==="cat" ? $("#o-cat", sheet).value : null);
      closeSheet(); render(); toast(ch==="cat" ? "已向其他類別借用" : ch==="next" ? "已向下個月借用" : "已從已節省結餘補上");
    }));
  });
}
function checkOverspend(s){
  const c = state.categories[s.categoryId];
  if(!c || c.type!=="expense" || !c.monthlyLimit || !c.warn) return false;
  if(!overOf(s)) return false;
  setPending(s, true); openOverspend(s); return true;
}

/* ---------- UI state ---------- */
const TABS = [["home","首","首頁"],["list","明","明細"],["wish","願","願望"],["report","報","報表"],["settings","設","設定"]];
let tab = "home";
try{ const t = localStorage.getItem("ledger.tab"); if(TABS.some(x=>x[0]===t)) tab = t; }catch(e){}
let viewPeriod = curPeriod();
let importPreview = null;

// actions: [[label, fn], ...] shown as buttons inside the toast
function toast(msg, actions, ms){
  const host = $("#toastHost");
  host.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${(actions||[]).map((a,i) => `<button class="toastbtn" data-ti="${i}">${esc(a[0])}</button>`).join("")}</div>`;
  (actions||[]).forEach((a,i) => host.querySelector(`[data-ti="${i}"]`).addEventListener("click", () => { host.innerHTML = ""; clearTimeout(toast._t); a[1](); }));
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ host.innerHTML = ""; }, ms || 2600);
}

function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,g,l]) => `<button data-tab="${k}" ${k===tab?'aria-current="page"':""}><b>${g}</b>${l}</button>`).join("");
}

function applyPalette(){
  const k = PALETTES[state.settings.palette] ? state.settings.palette : "blush";
  if(document.documentElement.dataset.palette !== k) document.documentElement.dataset.palette = k;
  const meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.content = PALETTES[k].bar;
}
function render(){
  applyPalette();
  renderTabs();
  const app = $("#app");
  const head = `<header class="top"><div class="brand">額度帳本</div><div class="sync${syncOn?" on":""}" id="sync"><i></i><span>${syncOn?"已同步":"只存在這個瀏覽器"}</span></div></header>`;
  const body = tab==="home" ? viewHome() : tab==="list" ? viewList() : tab==="wish" ? viewWish() : tab==="report" ? viewReport() : viewSettings();
  app.innerHTML = head + body;
  if(tab==="report") wireChart();
}

function periodNav(){
  const L = periodLabel(viewPeriod);
  return `<div class="period"><button class="iconbtn" data-act="prev" aria-label="上一期">‹</button>
    <div class="t"><b>${L.title}</b><span class="num">${L.range}</span></div>
    <button class="iconbtn" data-act="next" aria-label="下一期">›</button></div>`;
}

function txRows(list, withDays){
  if(!list.length) return `<div class="empty">這一期還沒有紀錄。按右下角「＋」記第一筆。</div>`;
  const sorted = [...list].sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  let html = "", lastDay = null;
  sorted.forEach(t => {
    if(withDays && t.date !== lastDay){
      lastDay = t.date; const d = parseYmd(t.date);
      const dayOut = sumOut(sorted.filter(x=>x.date===t.date));
      html += `<div class="daygrp"><span>${d.getMonth()+1} 月 ${d.getDate()} 日（${WEEK[d.getDay()]}）</span><span class="num">支出 ${moneyShort(dayOut)}</span></div>`;
    }
    const plus = t.type==="income" || t.type==="refund"; const cn = catName(t.categoryId);
    const kind = t.virtual ? "分期" : t.type==="refund" ? "退款" : "";
    const extra = [kind, t.pendingOverspend ? "超支待處理" : "", t.note].filter(Boolean).join(" · ");
    const sub = withDays ? [cn, extra].filter(Boolean).join(" · ") : [`${t.date.slice(5).replace("-","/")}`, cn, kind].filter(Boolean).join(" · ");
    const attr = t.virtual ? `data-inst="${esc(t.installmentId)}"` : `data-edit="${esc(t.id)}"`;
    html += `<button class="tx" ${attr}><span class="dot${plus?" inc":""}">${esc(cn.slice(0,1))}</span>
      <span class="mid"><b>${esc(t.title || cn)}</b><span>${esc(sub)}</span></span>
      <span class="amt${plus?" inc":""}">${plus?"+":"−"}${moneyShort(t.amount)}</span></button>`;
  });
  return html;
}

function budgetRows(p){
  const list = cats("expense").filter(c => c.monthlyLimit || c.yearlyLimit);
  if(!list.length) return `<div class="empty">還沒有設定預算。到「設定 → 類別與預算」幫想控制的類別設上限。</div>`;
  return list.map(c => {
    let html = `<div class="bud">`;
    if(c.monthlyLimit){
      const b = budgetOf(c, p); const pct = b.cap ? b.used / b.cap : 1;
      const cls = pct > 1 ? "over" : pct >= .8 ? "warn" : "";
      const tag = !c.warn ? `<span class="tag">不提醒</span>` : pct > 1 ? `<span class="stamp">超支</span>` : pct >= .8 ? `<span class="tag warn">快用完</span>` : "";
      const parts = [];
      if(b.inst || b.occupied || b.received){
        parts.push(`實際 ${moneyShort(b.actual)}`);
        if(b.inst) parts.push(`分期 ${moneyShort(b.inst)}`);
        if(b.occupied) parts.push(`被占用 ${moneyShort(b.occupied)}`);
        if(b.received) parts.push(`借入 ${moneyShort(b.received)}`);
      }
      html += `<div class="l1"><span class="n">${esc(c.name)} ${tag}</span><span class="num small">${moneyShort(b.used)} / ${moneyShort(b.cap)}</span></div>
        <div class="bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="${b.cap}" aria-valuenow="${b.used}" aria-label="${esc(c.name)} 已用 ${Math.round(pct*100)}%"><i style="width:${Math.min(100,pct*100)}%"></i></div>
        <div class="l2"><span>已用 ${Math.round(pct*100)}%</span><span class="num">${b.avail>=0?"還剩 "+moneyShort(b.avail):"超出 "+moneyShort(-b.avail)}</span></div>
        ${parts.length ? `<div class="l3 num">${parts.join(" · ")}</div>` : ""}`;
    } else {
      html += `<div class="l1"><span class="n">${esc(c.name)}</span><span class="small muted">沒有每月上限</span></div>`;
    }
    if(c.yearlyLimit){
      const yu = yearUsed(c, p.y); const over = yu > c.yearlyLimit;
      html += `<div class="l3 num${over?" bad":""}">${p.y} 年 ${moneyShort(yu)} / ${moneyShort(c.yearlyLimit)}${over?"（超過年度上限）":""}</div>`;
    }
    return html + `</div>`;
  }).join("");
}

function viewReport(){

  const rows = Object.entries(byCat).filter(([,v]) => v > 0).sort((a,b)=>b[1]-a[1]); const max = rows[0]?.[1] || 1;
  const rank = rows.length ? `<div class="rank">${rows.map(([id,v]) => `<div class="r"><span class="nm">${esc(catName(id))}</span><span class="track"><i style="width:${v/max*100}%"></i></span><span class="v">${moneyShort(v)}<small>${out>0?Math.round(v/out*100):0}%</small></span></div>`).join("")}</div>`
    : `<div class="empty">這一期沒有支出。</div>`;
  const n = recordedMonths();
  const refs = cats("expense").map(c => ({c, r: yearlyRef(c)})).filter(o => o.r && o.r.perYear > 0).sort((a,b)=>b.r.perYear-a.r.perYear);
  const refHtml = refs.length ? `<div class="tblwrap" style="padding:0 14px 14px"><table><thead><tr><th>類別</th><th>一年約</th><th>年度上限</th></tr></thead><tbody>

    : `<div class="empty">還沒有足夠的紀錄。</div>`;
  return periodNav() + `<div class="section"><div class="section-head"><h2>支出分類排行</h2><span class="label num">合計 ${money(out)}</span></div><div class="card">${rank}</div></div>

}

function trendData(){
  const out = []; for(let i=5;i>=0;i--){ const p = shift(viewPeriod,-i); const l = txIn(p); out.push({p, inc: sumIncome(l), exp: sumOut(l)}); }
  return out;
}
function niceMax(v){ if(v<=0) return 1000; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; }
function trendSvg(){
  const data = trendData(); const W = 520, H = 220, L = 44, R = 8, T = 10, B = 26;
  const max = niceMax(Math.max(...data.map(d=>Math.max(d.inc,d.exp))));
  const y = v => T + (H-T-B) * (1 - v/max); const cw = (W-L-R)/data.length; const bw = Math.min(22, cw/2 - 6);
  const ticks = [0, max/2, max];
  const fmt = v => v>=10000 ? (v/10000).toLocaleString("zh-TW",{maximumFractionDigits:1})+"萬" : moneyShort(v);
  const bar = (x, v, color) => { if(v<=0) return ""; const top = y(v), h = (H-B) - top, r = Math.min(4,h);
    return `<path d="M${x},${H-B} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${H-B} Z" fill="${color}"/>`; };
  let g = ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("");
  data.forEach((d,i) => {
    const cx = L + cw*i + cw/2;
    g += `<g class="col" data-i="${i}"><rect class="hit" x="${L+cw*i}" y="${T}" width="${cw}" height="${H-T-B}" rx="6"/>
      ${bar(cx-bw-1, d.inc, "var(--income)")}${bar(cx+1, d.exp, "var(--expense)")}
      <text x="${cx}" y="${H-8}" text-anchor="middle">${d.p.m} 月</text></g>`;
  });
  return `<div class="legend"><span><i style="background:var(--income)"></i>收入</span><span><i style="background:var(--expense)"></i>支出</span></div>
    <svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 6 期收入與支出長條圖">${g}</svg>`;
}
function trendTable(){
  const data = trendData();
  return `<details class="tbl"><summary>表格檢視</summary><div class="tblwrap"><table><thead><tr><th>期別</th><th>收入</th><th>支出</th><th>結餘</th></tr></thead><tbody>
    ${data.map(d => `<tr><td>${d.p.y}/${d.p.m}</td><td>${moneyShort(d.inc)}</td><td>${moneyShort(d.exp)}</td><td>${moneyShort(d.inc-d.exp)}</td></tr>`).join("")}</tbody></table></div></details>`;
}
function wireChart(){
  const box = $("#chartbox"); if(!box) return; const svg = box.querySelector("svg"); const data = trendData();
  let tip = null;
  const show = (g) => {
    box.querySelectorAll(".col").forEach(x=>x.classList.toggle("hover", x===g));
    const d = data[+g.dataset.i]; const r = g.getBoundingClientRect(), br = box.getBoundingClientRect();
    if(!tip){ tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
    tip.innerHTML = `${periodLabel(d.p).title}<span class="num">收入 ${moneyShort(d.inc)}</span><span class="num">支出 ${moneyShort(d.exp)}</span>`;
    const x = Math.max(70, Math.min(br.width-70, r.left - br.left + r.width/2));
    tip.style.left = x+"px"; tip.style.top = (r.top - br.top + 8)+"px";
  };
  const hide = () => { box.querySelectorAll(".col").forEach(x=>x.classList.remove("hover")); if(tip){ tip.remove(); tip = null; } };
  svg.querySelectorAll(".col").forEach(g => { g.addEventListener("pointerenter", ()=>show(g)); g.addEventListener("click", ()=>show(g)); });
  svg.addEventListener("pointerleave", hide);
}

function limitsText(c){
  const parts = [];
  if(c.perTxLimit) parts.push(`每筆 ${moneyShort(c.perTxLimit)}`);
  if(c.dailyLimit) parts.push(`單日 ${moneyShort(c.dailyLimit)}`);
  if(c.monthlyLimit) parts.push(`每月 ${moneyShort(c.monthlyLimit)}`);
  if(c.yearlyLimit) parts.push(`每年 ${moneyShort(c.yearlyLimit)}`);
  return parts.length ? parts.join(" · ") : "不設上限";
}
function instStatus(i){
  if(i.status==="paidoff") return "已提前還清";
  if(i.status==="cancelled") return "已取消";
  const done = Math.min(i.n, monthsBetween(fromKey(i.startPeriod), curPeriod()) + 1);
  return done >= i.n ? "已繳完" : `第 ${Math.max(1,done)}/${i.n} 期`;
}

/* ---------- sheets (modal) ---------- */
function openSheet(html, onMount){
  $("#overlay").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click", e => { if(e.target.id==="scrim"){ closeSheet(); render(); } });
  onMount && onMount($("#overlay .sheet"));
}
function closeSheet(){ $("#overlay").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#scrim")){ closeSheet(); render(); } });

// existing: a stored transaction to edit; refundOf: an expense to refund
// prefill: {type, categoryId, amount, title, note, favoriteId, wishId} for a new entry started from a favorite or wish
function openEntry(existing, refundOf, prefill){
  const isRefund = refundOf || existing?.type==="refund";
  const t = existing ? {...existing}
    : refundOf ? { id: uid(), date: todayStr(), type: "refund", categoryId: refundOf.categoryId, amount: refundOf.amount, title: `退款：${refundOf.title || catName(refundOf.categoryId)}`, note: "", refOf: refundOf.id }
    : prefill ? { id: uid(), date: todayStr(), type: prefill.type || "expense", categoryId: prefill.categoryId || null, amount: prefill.amount ?? null, title: prefill.title || "", note: prefill.note || "", favoriteId: prefill.favoriteId, wishId: prefill.wishId }
    : { id: uid(), date: todayStr(), type: "expense", categoryId: null, amount: null, title: "", note: "" };
  let type = t.type, catId = t.categoryId, confirmDel = false, inst = false, n = 3;
  const draw = sheet => {
    const list = usageOrder(type === "refund" ? "expense" : type);
    if(catId && !isRefund && state.categories[catId]?.type !== type) catId = null;
    const heading = isRefund ? (existing ? "編輯退款" : "退貨／退款") : existing ? "編輯紀錄" : t.wishId ? "買了" : "記一筆";
    const favs = !existing && !isRefund && !t.wishId && !t.favoriteId ? favList().filter(favUsable) : [];
    const canSaveFav = !isRefund && !inst && !(t.favoriteId && state.favorites[t.favoriteId]);
    sheet.innerHTML = `<div class="hd"><h2>${heading}</h2><button class="btn ghost" data-x>關閉</button></div>
      ${favs.length ? `<div class="favbar" role="group" aria-label="常用">${favs.map(f => `<button class="chip fav" data-favq="${esc(f.id)}">${esc(f.name)}${f.amount ? ` <span class="num">${moneyShort(f.amount)}</span>` : ""}</button>`).join("")}</div>` : ""}
      ${isRefund ? `<div class="hint">退款會算回「${esc(catName(catId))}」，那一期的額度會還回來。</div>`
        : `<div class="seg" role="group" aria-label="收支"><button data-type="expense" aria-pressed="${type==="expense"}">支出</button><button data-type="income" aria-pressed="${type==="income"}">收入</button></div>`}
      <label class="amount"><span>${inst ? "總額" : "NT$"}</span><input id="e-amt" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${t.amount ?? ""}" aria-label="金額"></label>
      ${isRefund ? "" : `<div class="chips" role="group" aria-label="類別">${list.map(c=>`<button class="chip" data-cat="${esc(c.id)}" aria-pressed="${c.id===catId}">${esc(c.name)}</button>`).join("")}</div>`}
      ${!existing && !isRefund && type==="expense" ? `<div class="instbox"><label class="toggle"><input type="checkbox" id="e-inst" ${inst?"checked":""}>分期付款</label>
        ${inst ? `<label class="field" style="flex-direction:row;align-items:center;gap:8px">期數<input class="inp num" id="e-n" inputmode="numeric" value="${n}" style="width:70px;text-align:right"></label>` : ""}</div>` : ""}
      <div id="e-hint"></div>
      <div class="fields">
        <label>日期<input class="inp" type="date" id="e-date" value="${t.date}"></label>
        <label>摘要<input class="inp" id="e-title" value="${esc(t.title)}" placeholder="例如：午餐"></label>
        <label class="full">備註<input class="inp" id="e-note" value="${esc(t.note)}" placeholder="選填"></label>
      </div>
      ${existing && (existing.type==="expense" || canSaveFav) ? `<div class="rowbtns">${existing.type==="expense" ? `<button class="btn" data-refund>退貨／退款</button>` : ""}${canSaveFav ? `<button class="btn" data-savefav>存成常用</button>` : ""}</div>` : ""}
      <div class="rowbtns">${existing ? `<button class="btn danger" data-del>${confirmDel?"確定刪除":"刪除"}</button>`:""}${!existing && canSaveFav ? `<button class="btn" data-savefav>存成常用</button>` : ""}<button class="btn primary" data-save>儲存</button></div>`;
    const amt = $("#e-amt", sheet);
    const hint = () => {
      const v = intOf(amt.value) || 0; const c = state.categories[catId]; const box = $("#e-hint", sheet);
      if(!c || c.type!=="expense"){ box.innerHTML = ""; return; }
      const date = $("#e-date", sheet).value || todayStr(); const p = periodOf(date); const L = periodLabel(p);
      const lines = [];
      let nowAmt = v;
      if(inst){
        const nn = Math.max(2, Math.min(60, intOf($("#e-n", sheet)?.value) || 2)); const per = Math.floor(v / nn), first = v - per*(nn-1);
        nowAmt = first;
        if(v) lines.push(["", `每期 <b class="num">${money(per)}</b>${first!==per?`，首期 ${moneyShort(first)}`:""}，從 ${L.short} 到 ${shift(p,nn-1).m} 月期，未來 ${nn-1} 期的${esc(c.name)}額度會先被占用`]);
      }
      const sign = isRefund ? -1 : 1;
      if(c.monthlyLimit){
        const b = budgetOf(c, p, t.id); const left = b.avail - sign*nowAmt; const pct = b.cap ? 1 - left / b.cap : 1;
        const cls = left < 0 ? (c.warn ? "over" : "") : pct >= .8 && c.warn ? "warn" : "ok";
        lines.push([cls, left >= 0 ? `記下後，${esc(c.name)}在 ${L.title} 還剩 <b class="num">${money(left)}</b>` : `記下後，${esc(c.name)}在 ${L.title} 會超出 <b class="num">${money(-left)}</b>`]);
      }
      if(!isRefund && c.warn){
        if(c.perTxLimit && v > c.perTxLimit) lines.push(["warn", `超過每筆上限 ${moneyShort(c.perTxLimit)}`]);
        if(c.dailyLimit){ const d = dayUsed(c, date, t.id) + nowAmt; if(d > c.dailyLimit) lines.push(["warn", `${esc(c.name)}今天會花到 ${moneyShort(d)}，超過單日上限 ${moneyShort(c.dailyLimit)}`]); }
        if(c.yearlyLimit){ const yv = yearUsed(c, p.y, t.id) + nowAmt; if(yv > c.yearlyLimit) lines.push(["warn", `${p.y} 年會花到 ${moneyShort(yv)}，超過年度上限 ${moneyShort(c.yearlyLimit)}`]); }
      }
      box.innerHTML = lines.map(([cls, txt]) => `<div class="hint ${cls}">${txt}</div>`).join("");
    };
    amt.addEventListener("input", () => { amt.value = amt.value.replace(/\D/g,""); t.amount = amt.value ? +amt.value : null; hint(); });
    $("#e-date", sheet).addEventListener("change", hint);
    ["e-title","e-note","e-date"].forEach(id => $("#"+id, sheet).addEventListener("input", e => { t[{"e-title":"title","e-note":"note","e-date":"date"}[id]] = e.target.value; }));
    sheet.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => { type = b.dataset.type; if(type!=="expense") inst = false; draw(sheet); }));
    sheet.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { catId = b.dataset.cat; sheet.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===b)); hint(); }));
    const instBox = $("#e-inst", sheet); instBox && instBox.addEventListener("change", () => { inst = instBox.checked; draw(sheet); });
    const nBox = $("#e-n", sheet); nBox && nBox.addEventListener("input", () => { nBox.value = nBox.value.replace(/\D/g,""); n = +nBox.value || 2; hint(); });
    $("[data-x]", sheet).addEventListener("click", closeSheet);
    const del = $("[data-del]", sheet);
    del && del.addEventListener("click", () => { if(!confirmDel){ confirmDel = true; del.textContent = "確定刪除"; return; } removeTx(existing, true); closeSheet(); render(); toast("已刪除"); });
    const ref = $("[data-refund]", sheet); ref && ref.addEventListener("click", () => openEntry(null, existing));
    sheet.querySelectorAll("[data-favq]").forEach(b => b.addEventListener("click", () => { const f = state.favorites[b.dataset.favq]; f && quickRecord(f); }));
    const sf = $("[data-savefav]", sheet);
    sf && sf.addEventListener("click", () => {
      if(!catId){ toast("先選一個類別"); return; }
      const draft = { type, categoryId: catId, amount: intOf(amt.value), title: $("#e-title", sheet).value.trim() };
      const dup = Object.values(state.favorites).find(x => favKey(x)===favKey(draft));
      if(dup){ toast(`已經有相同的常用「${dup.name}」`); return; }
      const f = saveFavFrom({ type, categoryId: catId, amount: intOf(amt.value), title: $("#e-title", sheet).value, note: $("#e-note", sheet).value.trim() });
      toast(`已存成常用「${f.name}」${f.amount ? "" : "（金額每次輸入）"}`);
    });
    $("[data-save]", sheet).addEventListener("click", () => {
      const v = intOf(amt.value); const date = $("#e-date", sheet).value;
      if(!v){ toast("請輸入金額"); amt.focus(); return; }
      if(!catId){ toast("請選一個類別"); return; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast("請選日期"); return; }
      const title = $("#e-title", sheet).value.trim(), note = $("#e-note", sheet).value.trim();
      if(inst){
        const nn = Math.max(2, Math.min(60, intOf($("#e-n", sheet).value) || 2)); const per = Math.floor(v / nn);
        const rec = { id: uid(), title: title || catName(catId), categoryId: catId, total: v, n: nn, per, first: v - per*(nn-1), date, note,
          startPeriod: pkey(periodOf(date)), status: "active", events: [{ type: "create", at: Date.now() }], createdAt: Date.now() };
        put.inst(rec); if(t.wishId) markWishBought(t.wishId, rec); closeSheet(); render(); toast(`已記下 ${nn} 期分期`);
        checkOverspend(subjectOf("inst", rec.id));
        return;
      }
      const rec = { id: t.id, date, type, categoryId: catId, amount: v, title, note, recurringId: t.recurringId || null, createdAt: t.createdAt || Date.now() };
      if(t.refOf) rec.refOf = t.refOf;
      if(t.favoriteId) rec.favoriteId = t.favoriteId;
      if(existing) removeTx(existing, false);
      addTx(rec);
      if(!existing && t.favoriteId) bumpFav(t.favoriteId, 1);
      if(t.wishId) markWishBought(t.wishId, rec);
      closeSheet(); render(); toast(existing ? "已更新" : isRefund ? "已記下退款" : t.wishId ? "已記下，願望移到已購入" : "已記下");
      let opened = false;
      if(type==="expense"){ opened = checkOverspend(subjectOf("tx", rec.id)); if(!opened && existing?.pendingOverspend) setPending(subjectOf("tx", rec.id), false); }
      if(!existing && !opened) suggestFavorite(rec);
    });
    hint();
    if(!existing) setTimeout(()=>amt.focus(), 50);
  };
  openSheet("", draw);
}

function openInstallment(i){
  let confirmDel = false;
  const draw = sheet => {
    const portions = instPortions(i); const cur = curPeriod(); const cidx = monthsBetween(fromKey(i.startPeriod), cur);
    const remainIdx = Math.max(0, cidx); let remainAmt = 0; for(let k=remainIdx; k<i.n; k++) remainAmt += instAmount(i, k);
    const futureCount = Math.max(0, i.n - remainIdx - 1);
    const evLabel = { create: "建立", paidoff: "提前還清", cancel: "取消／退款" };
    sheet.innerHTML = `<div class="hd"><h2>${esc(i.title)}</h2><button class="btn ghost" data-x>關閉</button></div>
      <div class="hint">${esc(catName(i.categoryId))} · 總額 <b class="num">${money(i.total)}</b> · ${i.n} 期，每期 ${moneyShort(i.per)}${i.first!==i.per?`（首期 ${moneyShort(i.first)}）`:""} · ${instStatus(i)}</div>
      <div class="tblwrap"><table><thead><tr><th>期別</th><th>金額</th></tr></thead><tbody>
        ${portions.map(t => { const p = periodOf(t.date); return `<tr><td>${p.y}/${p.m}（${t.k+1}/${i.n}）${t.note?" · "+t.note:""}</td><td>${moneyShort(t.amount)}</td></tr>`; }).join("")}</tbody></table></div>
      ${(i.events||[]).length ? `<p class="small muted" style="margin:0">紀錄：${i.events.map(e => `${evLabel[e.type]||e.type}${e.period?`（${e.period}）`:""} ${new Date(e.at).toLocaleDateString("zh-TW")}`).join("、")}</p>` : ""}
      ${i.status==="active" && cidx < i.n - 1 ? `<div class="opts">
        <div class="opt"><div class="k"><b>提前還清</b><span>剩下 ${i.n - remainIdx} 期共 ${moneyShort(remainAmt)} 移到本期</span></div><button class="btn" data-a="payoff">提前還清</button></div>
        <div class="opt"><div class="k"><b>取消／退款</b><span>本期之後的 ${futureCount} 期不再計算</span></div><button class="btn" data-a="cancel">取消後續</button></div></div>` : ""}
      <div class="rowbtns"><button class="btn danger" data-del>${confirmDel?"確定刪除整筆分期":"刪除"}</button></div>`;
    $("[data-x]", sheet).addEventListener("click", closeSheet);
    sheet.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => {
      const k = pkey(cidx < 0 ? fromKey(i.startPeriod) : cur); const a = b.dataset.a;
      i = { ...i, status: a==="payoff" ? "paidoff" : "cancelled", endPeriod: k, events: [...(i.events||[]), { type: a==="payoff" ? "paidoff" : "cancel", period: k, at: Date.now() }] };
      put.inst(i); closeSheet(); render(); toast(a==="payoff" ? "已改成提前還清" : "已取消後續期數");
      if(a==="payoff") checkOverspend({ kind: "inst", id: i.id, categoryId: i.categoryId, date: ymd(cycleStart(fromKey(k).y, fromKey(k).m)) < i.date ? i.date : ymd(cycleStart(fromKey(k).y, fromKey(k).m)), title: i.title });
    }));
    const del = $("[data-del]", sheet);
    del.addEventListener("click", () => { if(!confirmDel){ confirmDel = true; draw(sheet); return; } dropAdjFor(i.id); put.instDel(i.id); closeSheet(); render(); toast("已刪除分期"); });
  };
  openSheet("", draw);
}

function openCategory(c){
  const isNew = !c; c = c ? {...c} : { id: uid(), name: "", type: "expense", monthlyLimit: null, perTxLimit: null, dailyLimit: null, yearlyLimit: null, warn: true, archived: false, sort: Object.keys(state.categories).length };
  const ref0 = !isNew && c.type==="expense" ? yearlyRef(c) : null; const ref = ref0 && ref0.perYear > 0 ? ref0 : null;
  const lim = (id, label, v) => `<label>${label}<input class="inp num" id="${id}" inputmode="numeric" value="${v ?? ""}" placeholder="不設"></label>`;
  openSheet(`<div class="hd"><h2>${isNew?"新增類別":"編輯類別"}</h2><button class="btn ghost" data-x>關閉</button></div>
    <div class="fields">
      <label>名稱<input class="inp" id="c-name" value="${esc(c.name)}"></label>
      <label>收支<select id="c-type"><option value="expense" ${c.type==="expense"?"selected":""}>支出</option><option value="income" ${c.type==="income"?"selected":""}>收入</option></select></label>
      ${lim("c-tx","每筆上限（NT$）",c.perTxLimit)}${lim("c-day","單日上限",c.dailyLimit)}
      ${lim("c-limit","每月上限",c.monthlyLimit)}${lim("c-year","每年上限",c.yearlyLimit)}
    </div>
    ${ref ? `<p class="small muted" style="margin:0">依過去 ${ref.n} 個月的紀錄，一年約花 <b class="num">${money(ref.perYear)}</b>${ref.n<12?"（未滿 12 個月，僅供參考）":""}。</p>` : ""}
    <label class="toggle"><input type="checkbox" id="c-warn" ${c.warn?"checked":""}>快用完或超支時提醒我</label>
    <label class="toggle" id="c-pool-row"><input type="checkbox" id="c-pool" ${c.monthlyLimit && (c.toPool ?? !!c.warn)?"checked":""} ${c.monthlyLimit?"":"disabled"}>每期沒用完的額度轉入已節省結餘<span class="small muted" id="c-pool-note">${c.monthlyLimit?"":"（先設每月上限才能勾選）"}</span></label>
    <label class="toggle"><input type="checkbox" id="c-arch" ${c.archived?"checked":""}>停用這個類別（舊紀錄保留）</label>
    <div class="rowbtns"><button class="btn primary" data-save>儲存</button></div>`, sheet => {
    $("[data-x]", sheet).addEventListener("click", closeSheet);
    const pool = $("#c-pool", sheet), limitIn = $("#c-limit", sheet);
    limitIn.addEventListener("input", () => {
      const has = !!intOf(limitIn.value);
      if(!has) pool.checked = false; else if(pool.disabled) pool.checked = c.toPool ?? !!$("#c-warn", sheet).checked;
      pool.disabled = !has; $("#c-pool-note", sheet).textContent = has ? "" : "（先設每月上限才能勾選）";
    });
    $("[data-save]", sheet).addEventListener("click", () => {
      const name = $("#c-name", sheet).value.trim(); if(!name){ toast("請輸入類別名稱"); return; }
      Object.assign(c, { name, type: $("#c-type", sheet).value, perTxLimit: intOf($("#c-tx", sheet).value), dailyLimit: intOf($("#c-day", sheet).value),
        monthlyLimit: intOf($("#c-limit", sheet).value), yearlyLimit: intOf($("#c-year", sheet).value), warn: $("#c-warn", sheet).checked, toPool: !!intOf($("#c-limit", sheet).value) && $("#c-pool", sheet).checked, archived: $("#c-arch", sheet).checked });
      put.cat(c); closeSheet(); render(); toast("已儲存");
    });
  });
}

function openRecurring(r){
  const isNew = !r; const now = new Date();
  r = r ? {...r} : { id: uid(), title: "", amount: null, type: "expense", categoryId: null, day: 5, active: true, startMonth: `${now.getFullYear()}-${pad(now.getMonth()+1)}` };
  let confirmDel = false;
  const catOpts = type => cats(type).map(c=>`<option value="${esc(c.id)}" ${c.id===r.categoryId?"selected":""}>${esc(c.name)}</option>`).join("");
  openSheet(`<div class="hd"><h2>${isNew?"新增固定收支":"編輯固定收支"}</h2><button class="btn ghost" data-x>關閉</button></div>
    <div class="fields">
      <label class="full">項目<input class="inp" id="r-title" value="${esc(r.title)}" placeholder="例如：房貸"></label>
      <label>金額（NT$）<input class="inp" id="r-amt" inputmode="numeric" value="${r.amount ?? ""}"></label>
      <label>每月幾號<select id="r-day">${Array.from({length:31},(_,i)=>`<option ${r.day===i+1?"selected":""}>${i+1}</option>`).join("")}</select></label>
      <label>收支<select id="r-type"><option value="expense" ${r.type==="expense"?"selected":""}>支出</option><option value="income" ${r.type==="income"?"selected":""}>收入</option></select></label>
      <label>類別<select id="r-cat">${catOpts(r.type)}</select></label>
    </div>
    <label class="toggle"><input type="checkbox" id="r-active" ${r.active?"checked":""}>啟用</label>
    <div class="rowbtns">${isNew?"":`<button class="btn danger" data-del>刪除</button>`}<button class="btn primary" data-save>儲存</button></div>`, sheet => {
    $("[data-x]", sheet).addEventListener("click", closeSheet);

/* ---------- favorites (常用) ---------- */
const favKey = x => [x.type, x.categoryId, String(x.title || "").trim(), x.amount || ""].join("|");
function favList(){
  const list = Object.values(state.favorites);
  return state.settings.favManual
    ? list.sort((a,b)=>(a.order ?? 1e9)-(b.order ?? 1e9) || (a.createdAt||0)-(b.createdAt||0))
    : list.sort((a,b)=>(b.uses||0)-(a.uses||0) || (a.createdAt||0)-(b.createdAt||0));
}
function favUsable(f){ const c = state.categories[f.categoryId]; return !!c && !c.archived; }
function bumpFav(id, d){ const f = state.favorites[id]; if(!f) return; put.fav({ ...f, uses: Math.max(0, (f.uses||0) + d), lastUsedAt: d > 0 ? Date.now() : f.lastUsedAt }); }
function limitWarnings(c, date, amt, excludeId){
  const out = []; if(!c || c.type!=="expense" || !c.warn) return out;
  if(c.perTxLimit && amt > c.perTxLimit) out.push("超過每筆上限");
  if(c.dailyLimit && dayUsed(c, date, excludeId) + amt > c.dailyLimit) out.push("超過單日上限");
  if(c.yearlyLimit && yearUsed(c, periodOf(date).y, excludeId) + amt > c.yearlyLimit) out.push("超過年度上限");
  return out;
}
// Fixed amount: record today right away with an undo. No amount: open the entry sheet prefilled.
function quickRecord(f){
  if(!favUsable(f)){ closeSheet(); openFavorite(f); toast("這個常用的類別已停用，請改類別"); return; }
  if(!f.amount){ openEntry(null, null, { type: f.type, categoryId: f.categoryId, title: f.title || f.name, note: f.note || "", favoriteId: f.id }); return; }
  const t = { id: uid(), date: todayStr(), type: f.type, categoryId: f.categoryId, amount: f.amount, title: f.title || f.name, note: f.note || "", favoriteId: f.id, createdAt: Date.now() };
  const warns = limitWarnings(state.categories[f.categoryId], t.date, t.amount, t.id);
  addTx(t); bumpFav(f.id, 1);
  closeSheet(); render();
  toast(`已記下 ${f.name} ${moneyShort(f.amount)}${warns.length ? "（" + warns.join("、") + "）" : ""}`,

function saveFavFrom(t){

    title: String(t.title || "").trim(), note: t.note || "", uses: 0, createdAt: Date.now(), order: Object.keys(state.favorites).length };

// After a normal entry: same title, category and amount 3+ times in 60 days → offer to save it.
function suggestFavorite(t){
  if(t.favoriteId || !String(t.title || "").trim() || t.type==="refund") return;
  const k = favKey(t);
  if((state.settings.favDismissed || []).includes(k)) return;
  if(Object.values(state.favorites).some(f => favKey(f)===k)) return;
  const since = new Date(); since.setDate(since.getDate()-60); const s = ymd(since);
  const n = realTx().filter(x => x.date >= s && favKey(x)===k).length;

    ["存成常用", () => { saveFavFrom(t); render(); toast("已存成常用"); }],
    ["不用", () => { state.settings.favDismissed = [...(state.settings.favDismissed || []), k]; put.settings(); }]
  ], 9000);
}
function moveFav(id, dir){
  const list = favList(); const i = list.findIndex(f => f.id===id); const j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  if(!state.settings.favManual){ state.settings.favManual = true; put.settings(); }
  list.forEach((f, idx) => { if(f.order !== idx) put.fav({ ...f, order: idx }); });
  render();
}

const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
function wishScore(w){
  const created = w.addedOn || todayStr(); const days = Math.max(0, dayDiff(created, todayStr()));
  const parts = { need: w.need==="need" ? 40 : 10, wait: Math.round(Math.min(days, 30) / 30 * 20), budget: 0, deadline: 0 };
  const c = state.categories[w.categoryId];
  if(w.price){
    const avail = c && c.monthlyLimit ? budgetOf(c, curPeriod()).avail : Infinity;
    parts.budget = w.price <= avail ? 25 : w.price <= avail + poolBalance() ? 10 : 0;
  }
  if(w.deadline){ const d = dayDiff(todayStr(), w.deadline); parts.deadline = d <= 7 ? 15 : d <= 30 ? 8 : 0; }
  return { total: parts.need + parts.wait + parts.budget + parts.deadline, parts, days };
}
function wishBudgetLine(w){
  if(!w.price) return ["", "還沒填價格，填了才能算預算"];
  const c = state.categories[w.categoryId];
  if(!c) return ["", "還沒選類別"];
  if(!c.monthlyLimit) return ["", `${esc(c.name)}沒有每月上限`];
  const avail = budgetOf(c, curPeriod()).avail; const left = avail - w.price; const pool = poolBalance();
  if(left >= 0) return ["ok", `${esc(c.name)}本期還剩 ${moneyShort(avail)}，買了剩 <b class="num">${moneyShort(left)}</b>`];
  if(pool >= -left) return ["warn", `${esc(c.name)}本期還剩 ${moneyShort(Math.max(0, avail))}，買了會超出 <b class="num">${moneyShort(-left)}</b>，可用已節省結餘補（結餘 ${moneyShort(pool)}）`];
  return ["over", `${esc(c.name)}本期還剩 ${moneyShort(Math.max(0, avail))}，買了會超出 <b class="num">${moneyShort(-left)}</b>，已節省結餘也不夠`];
}
